        /* ===== Error Page – Tema oscuro y paleta general del sitio ===== */
        :root {
            --tx-bg-1:        #0b1322;

            --tx-surface:     #1a2436;

            --tx-primary:     #4f8fcf;

            --tx-primary-deep:#22456b;
            --tx-accent:      #3b82f6;
            --tx-shadow:      0 10px 28px rgba(0, 0, 0, 0.45);

        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }

        body {
            background:

                linear-gradient(180deg, var(--tx-bg-1) 0%, var(--tx-bg-2) 100%);
            background-attachment: fixed;
            color: var(--tx-text);
            font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
        }

        /* Glassmorphic Navbar */
        .clean-navbar.bg-white {
            background: rgba(15, 23, 38, 0.85) !important;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--tx-border);
            box-shadow: 0 1px 0 rgba(255, 255, 255, 0.03);
        }
        .clean-navbar .nav-link {
            color: var(--tx-label) !important;
            font-weight: 500;
            font-size: 0.78rem;
            padding-left: 0.42rem !important;
            padding-right: 0.42rem !important;
            letter-spacing: 0.01em;
        }
        .clean-navbar .nav-link.active,
        .clean-navbar .nav-link:hover { color: var(--tx-primary-2) !important; }
        .navbar-brand.logo { color: var(--tx-text-strong) !important; font-weight: 600; }
        .navbar-toggler { border-color: var(--tx-border) !important; }
        .navbar-toggler-icon { filter: invert(1) brightness(1.4) opacity(0.7); }

        /* Estilo oscuro para highlight-phone */
        .highlight-phone {
            background: transparent !important;
            color: var(--tx-text) !important;
            padding: 60px 0 40px;
        }
        .highlight-phone h2 {
            color: var(--tx-text-strong) !important;
            font-weight: 700;
        }
        .highlight-phone p {
            color: var(--tx-muted) !important;
        }
        .highlight-phone a {
            color: var(--tx-primary-2) !important;
            transition: color 0.2s ease;
        }
        .highlight-phone a:hover {
            color: var(--tx-text-strong) !important;
        }

        /* Estilo oscuro para footer */

            background: rgba(11, 19, 34, 0.8) !important;
            border-top: 1px solid var(--tx-border);
            padding: 24px 0;
            color: var(--tx-muted);
        }
        .footer-basic p.copyright {
            color: var(--tx-muted) !important;
            margin: 0;
