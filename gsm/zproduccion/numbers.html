<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Números · Didxazapp</title>
    <meta name="description" content="Galería de números con su nombre en Zapoteco del Istmo, español e inglés, con audio de pronunciación.">
    <link rel="icon" type="image/png" sizes="512x512" href="assets/img/Dictionary-icon.png">
    <!-- Bootstrap 4.3.1 served from cdnjs (matches the bootstrap.bundle.min.js below) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <style>
        /* Restore the two project-specific tweaks that the upstream
           bootstrap.min.css was carrying: a slightly cooler info color
           and Montserrat as the default sans-serif. The Montserrat
           webfont is already loaded via the <link> below this block. */
        :root { --info: #3b99e0; }
        body { font-family: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji"; }
        .bg-info { background-color: #3b99e0 !important; }
        .text-info { color: #3b99e0 !important; }
        .border-info { border-color: #3b99e0 !important; }
        .btn-info { background-color: #3b99e0; border-color: #3b99e0; }
        .btn-info:hover { background-color: #2d83c4; border-color: #2778b8; }
        .btn-outline-info { color: #3b99e0; border-color: #3b99e0; }
        .btn-outline-info:hover { background-color: #3b99e0; border-color: #3b99e0; }
        .alert-info { color: #1f5077; background-color: #d8eaf9; border-color: #c8e0f5; }
    </style>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Montserrat:400,500,600,700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/baguettebox.js/1.10.0/baguetteBox.min.css">
    <style>
        /* ===== Números – tema oscuro gris/azul (alineado con translator.html y animales.html) ===== */
        :root {
            --tx-bg-1:        #0b1322;
            --tx-bg-2:        #111c2f;
            --tx-surface:     #1a2436;
            --tx-surface-2:   #131c2c;
            --tx-surface-3:   #243047;
            --tx-border:      #2a3447;
            --tx-border-2:    #354260;
            --tx-text:        #e6ecf5;
            --tx-text-strong: #f3f6fb;
            --tx-muted:       #94a3b8;
            --tx-label:       #b6c2d4;
            --tx-primary:     #4f8fcf;
            --tx-primary-2:   #6ba6e0;
            --tx-accent:      #3b82f6;
            --tx-shadow:      0 10px 28px rgba(0, 0, 0, 0.45);
        }

        body {
            background:
                radial-gradient(1200px 600px at 80% -20%, rgba(59, 130, 246, 0.10), transparent 60%),
                radial-gradient(900px 500px at -10% 110%, rgba(79, 143, 207, 0.10), transparent 60%),
                linear-gradient(180deg, var(--tx-bg-1) 0%, var(--tx-bg-2) 100%);
            background-attachment: fixed;
            color: var(--tx-text);
            font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
        }

        /* Navbar */
        .clean-navbar.bg-white {
            background: rgba(15, 23, 38, 0.85) !important;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--tx-border);
            box-shadow: 0 1px 0 rgba(255, 255, 255, 0.03);
        }
        .clean-navbar .nav-link {
            color: var(--tx-label) !important;
            font-weight: 500;
            font-size: 0.78rem;
            padding-left: 0.42rem !important;
            padding-right: 0.42rem !important;
            letter-spacing: 0.01em;
        }
        .clean-navbar .nav-link.active,
        .clean-navbar .nav-link:hover { color: var(--tx-primary-2) !important; }
        .navbar-brand.logo { color: var(--tx-text-strong) !important; font-weight: 600; }
        .navbar-toggler { border-color: var(--tx-border) !important; }
        .navbar-toggler-icon { filter: invert(1) brightness(1.4) opacity(0.7); }

        /* Encabezado */
        .gallery-shell {
            max-width: 1180px;
            margin: 0 auto;
            padding: 110px 24px 60px;
        }
        .gallery-heading {
            text-align: center;
            margin-bottom: 32px;
        }
        .gallery-heading h1 {
            color: var(--tx-text-strong);
            font-weight: 600;
            letter-spacing: -0.01em;
            font-size: 2rem;
            margin: 0 0 8px;
        }
        .gallery-heading p {
            color: var(--tx-muted);
            font-size: 0.95rem;
            margin: 0;
        }

        /* Grid responsivo de tarjetas */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 22px;
        }

        .number-card {
            background: var(--tx-surface);
            border: 1px solid var(--tx-border);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--tx-shadow);
            transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
            display: flex;
            flex-direction: column;
        }
        .number-card:hover {
            transform: translateY(-3px);
            border-color: var(--tx-border-2);
            box-shadow: 0 14px 32px rgba(0, 0, 0, 0.55);
        }

        .number-photo {
            display: block;
            position: relative;
            aspect-ratio: 4 / 3;
            background: var(--tx-surface-2);
            overflow: hidden;
        }
        .number-photo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 12px;
            transition: transform 0.4s ease;
            display: block;
        }
        .number-card:hover .number-photo img { transform: scale(1.05); }

        .number-body {
            padding: 14px 16px 16px;
            border-top: 1px solid var(--tx-border);
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }
        .number-text { flex: 1; min-width: 0; }
        .number-name-zap {
            color: var(--tx-text-strong);
            font-size: 1.05rem;
            font-weight: 600;
            margin: 0 0 4px;
            letter-spacing: 0.005em;
            word-break: break-word;
        }

        /* Líneas de nombre (ES / EN) */
        .number-name-row {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin: 0;
            font-size: 0.85rem;
            color: var(--tx-muted);
        }
        .number-name-row + .number-name-row { margin-top: 2px; }
        .number-name-row .lang-tag {
            flex-shrink: 0;
            font-size: 0.6rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: var(--tx-primary-2);
            background: rgba(107, 166, 224, 0.14);
            border: 1px solid rgba(107, 166, 224, 0.25);
            padding: 1px 6px;
            border-radius: 999px;
            text-transform: uppercase;
        }
        .number-name-row .name-text { word-break: break-word; }

        /* Mostrar solo el idioma activo según el toggle */
        body[data-ui-lang="es"] [data-lang-row="en"] { display: none !important; }
        body[data-ui-lang="en"] [data-lang-row="es"] { display: none !important; }

        /* Botón de audio */
        .audio-btn {
            flex-shrink: 0;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1px solid var(--tx-border-2);
            background: var(--tx-surface-2);
            color: var(--tx-primary-2);
            font-size: 14px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease, transform 0.05s ease;
        }
        .audio-btn:hover {
            background: var(--tx-primary);
            border-color: var(--tx-primary);
            color: #ffffff;
        }
        .audio-btn:active { transform: scale(0.94); }
        .audio-btn:focus { outline: 2px solid var(--tx-accent); outline-offset: 2px; }
        .audio-btn.is-playing {
            background: var(--tx-primary);
            border-color: var(--tx-primary);
            color: #ffffff;
            animation: tx-pulse 1s ease-in-out infinite;
        }
        @keyframes tx-pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(79, 143, 207, 0.5); }
            50%      { box-shadow: 0 0 0 6px rgba(79, 143, 207, 0); }
        }

        /* Footer */
        .footer-basic {
            background: transparent;
            border-top: 1px solid var(--tx-border);
            margin-top: 40px;
            padding: 18px 0;
        }
        .footer-basic .copyright {
            color: var(--tx-muted);
            font-size: 0.82rem;
            margin: 0;
            text-align: center;
        }

        /* Toggle ES / EN */
        .ui-lang-row {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 14px;
        }
        .ui-lang-toggle {
            display: inline-flex;
            align-items: center;
            gap: 0;
            padding: 3px;
            background: var(--tx-surface-2);
            border: 1px solid var(--tx-border-2);
            border-radius: 999px;
            box-shadow: var(--tx-shadow);
        }
        .ui-lang-toggle button {
            appearance: none;
            border: 0;
            padding: 5px 14px;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--tx-label);
            background: transparent;
            border-radius: 999px;
            cursor: pointer;
            transition: background 0.12s ease, color 0.12s ease;
        }
        .ui-lang-toggle button:hover { color: var(--tx-text-strong); }
        .ui-lang-toggle button.is-active {
            background: var(--tx-primary);
            color: #ffffff;
        }
        .ui-lang-toggle button:focus-visible {
            outline: 2px solid var(--tx-accent);
            outline-offset: 2px;
        }

        /* Selección y scroll */
        ::selection {
            background: rgba(59, 130, 246, 0.45);
            color: var(--tx-text-strong);
        }

        @media (max-width: 575.98px) {
            .gallery-shell {
                padding: 100px 12px 36px;
            }
            .gallery-heading {
                margin-bottom: 20px;
            }
            .gallery-heading h1 {
                font-size: 1.45rem;
                margin-bottom: 6px;
            }
            .gallery-heading p {
                font-size: 0.88rem;
                padding: 0 4px;
            }
            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .number-card {
                border-radius: 10px;
            }
            .number-photo {
                aspect-ratio: 4 / 3;
            }
            .number-photo img {
                padding: 8px;
            }
            .number-body {
                padding: 10px 10px 12px;
                gap: 8px;
            }
            .number-name-zap {
                font-size: 0.92rem;
                margin-bottom: 3px;
            }
            .number-name-row {
                font-size: 0.78rem;
                gap: 4px;
            }
            .number-name-row .lang-tag {
                font-size: 0.58rem;
                padding: 1px 4px;
            }
            .audio-btn {
                width: 34px;
                height: 34px;
                font-size: 13px;
            }
        }

        @media (max-width: 350px) {
            .gallery-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

    <main class="gallery-shell">
        <header class="gallery-heading">
            <div class="ui-lang-row">
                <div class="ui-lang-toggle" role="group" aria-label="Interface language / Idioma de interfaz">
                    <button type="button" id="btn_ui_es" class="is-active" data-ui-lang="es" aria-pressed="true">ES</button>
                    <button type="button" id="btn_ui_en" data-ui-lang="en" aria-pressed="false">EN</button>
                </div>
            </div>
            <h1 data-i18n="page.title">Números en Zapoteco</h1>
            <p data-i18n="page.subtitle">Galería de números con su nombre en Zapoteco del Istmo, español, inglés y audio de pronunciación.</p>
        </header>

        <section class="gallery-grid" id="number-gallery">
            <!-- Las tarjetas se generan dinámicamente desde el array `NUMEROS`. -->
        </section>
    </main>

    <div class="footer-basic">
        <footer>
            <p class="copyright">Nacubi research · <span id="anio"></span></p>
        </footer>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.3.1/js/bootstrap.bundle.min.js"></script>

    <script>
        // Lista de números (zapoteco + español + inglés + slug compartido para imagen y audio).
        const NUMEROS = [
            { zap: "Gasti'",                  es: "Cero",          en: "Zero",         slug: "cero" },
            { zap: "Gala'",                   es: "Un medio",      en: "One half",     slug: "un_medio" },
            { zap: "Tobi",                    es: "Uno",           en: "One",          slug: "uno" },
            { zap: "Chupa",                   es: "Dos",           en: "Two",          slug: "dos" },
            { zap: "Chonna",                  es: "Tres",          en: "Three",        slug: "tres" },
            { zap: "Tapa",                    es: "Cuatro",        en: "Four",         slug: "cuatro" },
            { zap: "Ga'yu'",                  es: "Cinco",         en: "Five",         slug: "cinco" },
            { zap: "Xho'pa'",                 es: "Seis",          en: "Six",          slug: "seis" },
            { zap: "Gaadxe",                  es: "Siete",         en: "Seven",        slug: "siete" },
            { zap: "Xhoono",                  es: "Ocho",          en: "Eight",        slug: "ocho" },
            { zap: "Ga'",                     es: "Nueve",         en: "Nine",         slug: "nueve" },
            { zap: "Chii",                    es: "Diez",          en: "Ten",          slug: "diez" },
            { zap: "Chii ne tobi",            es: "Once",          en: "Eleven",       slug: "once" },
            { zap: "Chii ne chuppa",          es: "Doce",          en: "Twelve",       slug: "doce" },
            { zap: "Chii ne chonna",          es: "Trece",         en: "Thirteen",     slug: "trece" },
            { zap: "Chii ne tapa",            es: "Catorce",       en: "Fourteen",     slug: "catorce" },
            { zap: "Chi ne xhono",            es: "Dieciocho",     en: "Eighteen",     slug: "dieciocho" },
            { zap: "Gande",                   es: "Veinte",        en: "Twenty",       slug: "veinte" },
            { zap: "Gande nu chuppa",         es: "Veintidós",     en: "Twenty-two",   slug: "veintidos" },
            { zap: "Gande nu tappa",          es: "Veinticuatro",  en: "Twenty-four",  slug: "veinticuatro" },
            { zap: "Gande nu gaayu'",         es: "Veinticinco",   en: "Twenty-five",  slug: "veinticinco" },
            { zap: "Gande Chii",              es: "Treinta",       en: "Thirty",       slug: "treinta" },
            { zap: "Chupa late gande",        es: "Cuarenta",      en: "Forty",        slug: "cuarenta" },
            { zap: "Chupa late gande chii",   es: "Cincuenta",     en: "Fifty",        slug: "cincuenta" },
            { zap: "Chonna late gande",       es: "Sesenta",       en: "Sixty",        slug: "sesenta" },
            { zap: "Chonna late gande chii",  es: "Setenta",       en: "Seventy",      slug: "setenta" },
            { zap: "Tapa late gande",         es: "Ochenta",       en: "Eighty",       slug: "ochenta" },
            { zap: "Tapa late gande chii",    es: "Noventa",       en: "Ninety",       slug: "noventa" },
            { zap: "Ti gayuaa",               es: "Cien",          en: "One hundred",  slug: "cien" },
            { zap: "Gayuua'",                 es: "Ciento",        en: "One hundred",  slug: "ciento" },
            { zap: "Chuupa gayuua'",          es: "Doscientos",    en: "Two hundred",  slug: "doscientos" },
            { zap: "Chonna gayuua'",          es: "Trescientos",   en: "Three hundred", slug: "trescientos" },
            { zap: "Tappa gayuua'",           es: "Cuatrocientos", en: "Four hundred", slug: "cuatrocientos" },
            { zap: "Gaayu gayuaa",            es: "Quinientos",    en: "Five hundred", slug: "quinientos" },
            { zap: "Xho'pa gayuua'",          es: "Seiscientos",   en: "Six hundred",  slug: "seiscientos" },
            { zap: "Gadxe gayuua'",           es: "Setecientos",   en: "Seven hundred", slug: "setecientos" },
            { zap: "Ga' gayuua'",             es: "Novecientos",   en: "Nine hundred", slug: "novecientos" },
            { zap: "Ti mil",                  es: "Mil",           en: "One thousand", slug: "mil" },
        ];
        const IMG_BASE   = "assets/img/numeros/";
        const AUDIO_BASE = "assets/audios/numeros/";

        // Render
        const $gallery = document.getElementById('number-gallery');
        const escapeHtml = s => s.replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
        $gallery.innerHTML = NUMEROS.map(n => `
            <article class="number-card">
                <div class="number-photo">
                    <img src="${IMG_BASE}${n.slug}.png" alt="${escapeHtml(n.es)} (${escapeHtml(n.zap)} en zapoteco)" loading="lazy">
                </div>
                <div class="number-body">
                    <div class="number-text">
                        <h3 class="number-name-zap">${escapeHtml(n.zap)}</h3>
                        <p class="number-name-row" data-lang-row="es"><span class="lang-tag">ES</span><span class="name-text">${escapeHtml(n.es)}</span></p>
                        <p class="number-name-row" data-lang-row="en"><span class="lang-tag">EN</span><span class="name-text">${escapeHtml(n.en)}</span></p>
                    </div>
                    <button type="button" class="audio-btn" data-audio="${AUDIO_BASE}${n.slug}.mp3" data-zap="${escapeHtml(n.zap)}"
                            aria-label="Reproducir pronunciación de ${escapeHtml(n.zap)}" title="Escuchar">
                        <i class="fa fa-volume-up" aria-hidden="true"></i>
                    </button>
                </div>
            </article>
        `).join('');

        // Audio: una sola instancia, se detiene la anterior al pulsar otro botón.
        let currentAudio = null;
        let currentBtn = null;
        function stopAudio() {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }
            if (currentBtn) currentBtn.classList.remove('is-playing');
            currentAudio = null;
            currentBtn = null;
        }
        $gallery.addEventListener('click', (ev) => {
            const btn = ev.target.closest('.audio-btn');
            if (!btn) return;
            const url = btn.dataset.audio;
            // Si volvemos a pulsar el botón ya activo, paramos.
            if (currentBtn === btn) { stopAudio(); return; }
            stopAudio();
            const audio = new Audio(url);
            currentAudio = audio;
            currentBtn = btn;
            btn.classList.add('is-playing');
            audio.addEventListener('ended', stopAudio, { once: true });
            audio.addEventListener('error', stopAudio, { once: true });
            audio.play().catch(() => stopAudio());
        });

        // Año automático en el footer
        document.getElementById('anio').textContent = new Date().getFullYear();

        // ---- i18n: toggle ES / EN ----
        const UI_LANG_KEY = 'numeros_ui_lang_v1';
        const SHARED_LANG_KEY = 'didxazapp_ui_lang_v1';
        const I18N = {
            es: {
                'meta.title': 'Números · Didxazapp',
                'meta.description': 'Galería de números con su nombre en Zapoteco del Istmo, español e inglés, con audio de pronunciación.',
                'nav.home': 'INICIO',
                'nav.translator': 'TRADUCTOR',
                'nav.image': 'IMAGEN',
                'nav.learn': 'APRENDER',
                'nav.numbers': 'NÚMEROS',
                'nav.animals': 'ANIMALES',
                'nav.plants': 'PLANTAS',
                'nav.memory': 'MEMORAMA',
                'nav.faq': 'FAQ',
                'page.title': 'Números en Zapoteco',
                'page.subtitle': 'Galería de números con su nombre en Zapoteco del Istmo, español, inglés y audio de pronunciación.',
                'audio.listen': 'Escuchar',
                'audio.play_label': 'Reproducir pronunciación de {zap}',
            },
            en: {
                'meta.title': 'Numbers · Didxazapp',
                'meta.description': 'Number gallery with names in Isthmus Zapotec, Spanish, and English, with audio pronunciation.',
                'nav.home': 'HOME',
                'nav.translator': 'TRANSLATOR',
                'nav.image': 'IMAGE',
                'nav.learn': 'LEARN',
                'nav.numbers': 'NUMBERS',
                'nav.animals': 'ANIMALS',
                'nav.plants': 'PLANTS',
                'nav.memory': 'MEMORY GAME',
                'nav.faq': 'FAQ',
                'page.title': 'Numbers in Zapotec',
                'page.subtitle': 'Gallery of numbers with their names in Isthmus Zapotec, Spanish, English, and audio pronunciation.',
                'audio.listen': 'Listen',
                'audio.play_label': 'Play pronunciation of {zap}',
            }
        };

        const ALL_LANG_KEYS = [
            'didxazapp_ui_lang_v1', 'index_ui_lang_v1', 'translator_ui_lang_v1',
            'animals_ui_lang_v1', 'animales_ui_lang_v1', 'numbers_ui_lang_v1', 'numeros_ui_lang_v1', 'memorygame_ui_lang_v1',
            'learn_ui_lang_v1', 'aprender_ui_lang_v1', 'translator_img_ui_lang_v1'
        ];

        let UI_LANG = (() => {
            try {
                for (const k of ALL_LANG_KEYS) {
                    const saved = localStorage.getItem(k);
                    if (saved === 'es' || saved === 'en') return saved;
                }
            } catch (e) { /* ignore */ }
            return 'es';
        })();

        function t(key, params) {
            const dict = I18N[UI_LANG] || I18N.es;
            let s = (dict[key] !== undefined) ? dict[key] : (I18N.es[key] !== undefined ? I18N.es[key] : key);
            if (params) {
                s = s.replace(/\{(\w+)\}/g, (_, k) => (params[k] !== undefined ? params[k] : `{${k}}`));
            }
            return s;
        }

        function applyI18n() {
            document.documentElement.lang = UI_LANG;
            document.body.setAttribute('data-ui-lang', UI_LANG);
            if (I18N.es['meta.title']) {
                document.title = t('meta.title');
            }
            const metaDesc = document.querySelector('meta[name="description"]');
            if (metaDesc) {
                metaDesc.setAttribute('content', t('meta.description'));
            }
            document.querySelectorAll('[data-i18n]').forEach(el => {
                el.innerHTML = t(el.dataset.i18n);
            });
            document.querySelectorAll('.ui-lang-toggle button[data-ui-lang]').forEach(b => {
                const active = b.dataset.uiLang === UI_LANG;
                b.classList.toggle('is-active', active);
                b.setAttribute('aria-pressed', active ? 'true' : 'false');
            });
            document.querySelectorAll('.audio-btn').forEach(btn => {
                const zap = btn.dataset.zap || '';
                btn.setAttribute('title', t('audio.listen'));
                btn.setAttribute('aria-label', t('audio.play_label', { zap: zap }));
            });
        }

        function setUiLang(lang) {
            if (lang !== 'es' && lang !== 'en') return;
            UI_LANG = lang;
            try {
                ALL_LANG_KEYS.forEach(k => localStorage.setItem(k, lang));
            } catch (e) { /* ignore */ }
            applyI18n();
        }

        document.querySelectorAll('.ui-lang-toggle button[data-ui-lang]').forEach(b => {
            b.addEventListener('click', () => setUiLang(b.dataset.uiLang));
        });

        window.addEventListener('storage', (e) => {
            if (e.key && ALL_LANG_KEYS.includes(e.key) && (e.newValue === 'es' || e.newValue === 'en')) {
                if (UI_LANG !== e.newValue) setUiLang(e.newValue);
            }
        });

        applyI18n();
    </script>
    <script src="assets/js/page-config.js" data-page="numbers"></script>
</body>

</html>
